[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop-assistant"
version = "1.0.0"
description = "Production-Ready Windows AI Desktop Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "rich>=13.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pyperclip>=1.8.0",
    "pillow>=10.0.0",
    "requests>=2.30.0",
]

[project.scripts]
jarvis = "jarvis.main:main"
